# Frontend-Prüflauf — Modulverantwortlicher: Erik
#
# Führt bei jedem Push und jedem Pull Request zwei Dinge aus:
#   1. die 229 lauffähigen Unit-Tests aus frontend/tests/,
#   2. pylint über frontend/ — mit installiertem PyQt6 und ohne die
#      Ausnahme ignored-modules, also gegen die echten Qt-Signaturen.
# Beides ist bewusst auf das Frontend beschränkt: Backend und Datenbank
# haben eigene Verantwortliche und eigene Testpläne.
#
# Warum headless funktioniert: frontend/tests/__init__.py setzt
# QT_QPA_PLATFORM=offscreen, Qt braucht damit keinen X-Server — nur ein paar
# Systembibliotheken, die der Runner nicht vorinstalliert hat.

name: Frontend Tests

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch: # manuell startbar

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 ist die Zielversion des Devcontainers; 3.12 läuft mit, damit
        # ein Versionsproblem sofort von einem Kompatibilitätsproblem
        # unterscheidbar ist.
        python-version: ["3.12", "3.14"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Systembibliotheken für PyQt6 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Tests ausführen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s frontend/tests -t . -v

      - name: Anwendung startet ohne Backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PyQt6.QtCore import QTimer
          from PyQt6.QtWidgets import QApplication
          from frontend.main import _get_qss
          from frontend.core.frontend_controller import FrontendController
          from frontend.core.main_window import ZooMainWindow

          app = QApplication(sys.argv)
          app.setStyleSheet(_get_qss())
          window = ZooMainWindow(FrontendController(None))
          window.show()
          for _ in range(20):
              window._tick()
          print("Frontend startet und tickt auch ohne Engine.")
          PY

  lint:
    name: pylint (strikt, mit PyQt6)
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # pylint importiert PyQt6 wirklich (extension-pkg-allow-list in
      # .pylintrc), um die C-Erweiterung zu inspizieren — dafür müssen die
      # Qt-Systembibliotheken da sein, genau wie beim Testlauf.
      - name: Systembibliotheken für PyQt6 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt
          pip install "pylint>=4.0"

      # --ignored-modules= hebt die Ausnahme aus .pylintrc wieder auf. Sie ist
      # nur dafür da, dass pylint auch außerhalb der Projektumgebung läuft;
      # hier ist PyQt6 installiert, also wird gegen die echten Qt-Signaturen
      # geprüft. --fail-under=10 lässt den Job bei der ersten Meldung rot
      # werden statt nur die Note zu senken.
      - name: pylint über das Frontend
        run: python -m pylint --ignored-modules= --fail-under=10 frontend/
